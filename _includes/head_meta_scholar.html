{% if page.title %}
<meta name="citation_title" content="{{ page.title | xml_escape }}">
{% endif %}

{% if page.authors %}
  {% for a in page.authors %}
<meta name="citation_author" content="{{ a.name | xml_escape }}">
  {% endfor %}
{% endif %}

{% if page.date %}
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
{% endif %}

{% if page.journal %}
<meta name="citation_journal_title" content="{{ page.journal | xml_escape }}">
{% endif %}

{% if page.pdf_url %}
<meta name="citation_pdf_url" content="{{ page.pdf_url | absolute_url }}">
{% endif %}

{% if page.doi %}
<meta name="citation_doi" content="{{ page.doi }}">
{% endif %}
